debug = false

# Bound the standalone daemon's cache without confusing it with Docker images.
# These are periodic GC targets rather than a hard quota during an active build.
[worker.oci]
  gc = true
  reservedSpace = "512MB"
  maxUsedSpace = "4GB"
  minFreeSpace = "5GB"

# There are no [registry."..."] sections here any more.
#
# They existed because the build pushed to a local plain-HTTP registry and
# BuildKit refuses HTTP unless told to allow it. A build now exports the image
# straight into the host's Docker daemon over the API, so nothing is pushed and
# there is no registry to distrust. Base images still come from Docker Hub,
# which is HTTPS and needs no exception.
