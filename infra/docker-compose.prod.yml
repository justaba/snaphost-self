name: snaphost-self

# Production manifest. One application image pinned to an exact published
# version, plus BuildKit for builds.
#
# An unset variable means "use the application's default", so this file renders
# from three: SNAPHOST_VERSION, DOMAIN_SUFFIX and OPENROUTER_API_KEY. The empty
# defaults are not decoration — Compose warns on every unset variable, and
# forty of those on each command is how an operator learns to ignore output.
# What is NOT written here is a copy of any default the Go config packages
# already hold: two places holding one number is how they drift.
#
# PostgreSQL is gone with item 6: the store is a SQLite file in the
# application's own volume. That removes the container, the volume, five
# environment variables and the healthcheck the whole rollout waited on — and
# it moves the backup from `pg_dump` over a network socket to `sqlite3 .dump`
# inside the one container that has the file.
#
# The image comes from a public package, so there is no registry credential on
# the host and nothing here for us to issue per operator (Task 7). snaphostctl
# installs this manifest and keeps its pinned version aligned with release
# state and the Git checkout.
#
# Public routing is also incomplete after the collapse. The old Caddy example
# depended on the removed router-svc/cloud path, while Docker currently emits
# Traefik labels only for local generated hostnames. Do not treat this manifest
# as a complete production edge until Task 4 lands, or the operator supplies
# an equivalent HTTPS and routing layer.

services:
  snaphost:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/justaba/snaphost-self}/snaphost:${SNAPHOST_VERSION:?set SNAPHOST_VERSION to a published version tag, for example v1.2.3}"
    restart: unless-stopped
    networks:
      - control
      - data
    # The only published port. Everything else answers on an internal network,
    # and `data` is marked internal, so nothing on it can reach outward.
    ports:
      - "${SNAPHOST_BIND_ADDRESS:-0.0.0.0}:${SNAPHOST_PORT:-8080}:8080"
    volumes:
      # The runtime backend starts user containers through the host daemon.
      # This is the largest privilege in the file: anything that can reach this
      # socket is root on the host. It replaced a cloud service-account key, and
      # unlike that key it has no per-environment identity to check.
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # The whole store. One file, held open by this process, which is why the
      # backup runs `sqlite3 .dump` in here rather than copying the volume.
      - snaphost_data:/var/snaphost/data
    # The process stays uid 1000, but joins the numeric group owning the host
    # socket. snaphostctl derives and pins this value during install/upgrade.
    # Docker Desktop uses gid 0; a Linux host normally uses its docker group.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    depends_on:
      buildkitd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The memory limit is the only place the ceiling is written. The process
    # reads its own cgroup at startup and derives GOMEMLIMIT from it, so the two
    # cannot drift — and the drift's symptom would have been an OOM kill under
    # load rather than an error anyone saw.
    #
    # It has to cover more than the Go heap because the build workspace's page
    # cache and runtime non-heap allocations are charged here too; the reserve
    # inside the process is what leaves room for them.
    deploy:
      resources:
        limits:
          cpus: "${SNAPHOST_CPU_LIMIT:-1.0}"
          memory: "${SNAPHOST_MEMORY_LIMIT:-512M}"
    environment:
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-}"
      # How much of the container limit is held back from the Go heap for page
      # cache and other non-heap memory. Empty takes the default.
      GOMEMLIMIT_RESERVE_MB: "${GOMEMLIMIT_RESERVE_MB:-}"
      DATABASE_PATH: "/var/snaphost/data/snaphost.db"
      # Hard-coded, not read from the env file. The env file carried
      # RUN_MIGRATIONS=false and this file did not pass it, so the application
      # migrated at startup anyway and the profile-only migrate service was
      # decoration — on SQLite that is two containers opening one file. Passing
      # the variable fixed the symptom and left the hazard: the Go default is
      # `true`, so an install whose env file simply omits the line gets startup
      # migrations back. There is no production configuration where this should
      # be true, because `deploy.sh` always runs the migrator as its own step
      # after taking the pre-migration dump.
      RUN_MIGRATIONS: "false"
      OPERATOR_EMAIL: "${OPERATOR_EMAIL:-operator@localhost}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-}"

      SAGA_BUILD_TIMEOUT_MIN: "${SAGA_BUILD_TIMEOUT_MIN:-}"
      SAGA_RESUME_INTERVAL_SEC: "${SAGA_RESUME_INTERVAL_SEC:-}"
      DEPLOY_DEFAULT_PORT: "${DEPLOY_DEFAULT_PORT:-}"

      DOMAIN_SUFFIX: "${DOMAIN_SUFFIX:-}"
      RESERVED_DOMAINS: "${RESERVED_DOMAINS:-}"
      # The DNS targets an attached custom domain is told to point at. They
      # were in the env template and in the development manifest, and this file
      # did not pass them — so in production `POST /api/v1/domains` answered
      # 503 edge_address_unreserved no matter what the operator configured,
      # because the application refuses an attach while it has no address to
      # hand out. Empty is still a valid state: it means custom domains are
      # not offered on this install.
      DOMAIN_CNAME_TARGET: "${DOMAIN_CNAME_TARGET:-}"
      DOMAIN_A_RECORD_TARGET: "${DOMAIN_A_RECORD_TARGET:-}"
      DEPLOY_TTL_MIN: "${DEPLOY_TTL_MIN:-}"
      DEPLOY_TTL_MAX_MIN: "${DEPLOY_TTL_MAX_MIN:-}"
      MAX_DOMAINS_PER_USER: "${MAX_DOMAINS_PER_USER:-}"
      DOMAIN_ATTACH_REQUIRE_IDENTITY: "${DOMAIN_ATTACH_REQUIRE_IDENTITY:-}"
      DOMAIN_ATTACH_PER_HOUR: "${DOMAIN_ATTACH_PER_HOUR:-}"
      DOMAIN_VERIFY_INTERVAL_SEC: "${DOMAIN_VERIFY_INTERVAL_SEC:-}"
      DOMAIN_REVERIFY_HOURS: "${DOMAIN_REVERIFY_HOURS:-}"
      DOMAIN_VERIFY_GRACE_HOURS: "${DOMAIN_VERIFY_GRACE_HOURS:-}"
      PROJECT_DEPLOY_RETENTION: "${PROJECT_DEPLOY_RETENTION:-}"

      BUILDKIT_HOST: "tcp://buildkitd:1234"
      WORKDIR_ROOT: "/var/snaphost/builds"
      MAX_REPO_SIZE_MB: "${MAX_REPO_SIZE_MB:-}"
      MAX_BUILD_TIME_MIN: "${MAX_BUILD_TIME_MIN:-}"
      MAX_CONCURRENT_PER_USER: "${MAX_CONCURRENT_PER_USER:-}"
      ALLOWED_GIT_HOSTS: "${ALLOWED_GIT_HOSTS:-}"
      ALLOWED_BASE_IMAGES: "${ALLOWED_BASE_IMAGES:-}"
      ALLOWED_BASE_IMAGES_PERMISSIVE: "${ALLOWED_BASE_IMAGES_PERMISSIVE:-}"

      CONTAINER_CPU_LIMIT: "${CONTAINER_CPU_LIMIT:-}"
      CONTAINER_MEMORY_MB: "${CONTAINER_MEMORY_MB:-}"
      CONTAINER_DEFAULT_TTL_MIN: "${CONTAINER_DEFAULT_TTL_MIN:-}"
      RUNTIME_PROBE_ENABLED: "${RUNTIME_PROBE_ENABLED:-}"
      RUNTIME_PROBE_TIMEOUT_SEC: "${RUNTIME_PROBE_TIMEOUT_SEC:-}"
      WATCHDOG_INTERVAL_SEC: "${WATCHDOG_INTERVAL_SEC:-}"
      STRICT_IMAGE_VALIDATION: "${STRICT_IMAGE_VALIDATION:-true}"
      ALLOWED_IMAGE_PREFIXES: "${ALLOWED_IMAGE_PREFIXES:-snaphost/}"

      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_JSON_MODE: "${LLM_JSON_MODE:-}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      OPENROUTER_REFERER: "${OPENROUTER_REFERER:-}"
      OPENROUTER_APP_NAME: "${OPENROUTER_APP_NAME:-}"

  # One-shot migrator under a profile, so a deployment can apply the schema as
  # its own step before the service that would otherwise do it at startup is
  # allowed to run.
  #
  # It mounts the same volume rather than reaching a database over a network,
  # which is the shape SQLite forces: the migration and the process it runs
  # ahead of are two containers sharing one file, so they must not overlap.
  # `compose run --rm` finishes before the rollout continues, which is what
  # keeps them apart.
  snaphost-migrate:
    image: "${GHCR_IMAGE_PREFIX:-ghcr.io/justaba/snaphost-self}/snaphost:${SNAPHOST_VERSION:?set SNAPHOST_VERSION to a published version tag, for example v1.2.3}"
    profiles: ["migration"]
    entrypoint: ["/control-migrate"]
    restart: "no"
    # It needs no network at all now that the store is a file, but Compose
    # attaches a service without one to a `default` network it invents. Keep it
    # on `data`, which is marked internal.
    networks:
      - data
    volumes:
      - snaphost_data:/var/snaphost/data
    environment:
      DATABASE_PATH: "/var/snaphost/data/snaphost.db"
      LOG_LEVEL: "${LOG_LEVEL:-}"

  buildkitd:
    image: "moby/buildkit:v0.29.0-rootless"
    restart: unless-stopped
    command: ["--addr", "tcp://0.0.0.0:1234", "--config", "/home/user/.config/buildkit/buildkitd.toml"]
    user: "1000:1000"
    security_opt:
      - seccomp=unconfined
      - apparmor=snaphost-buildkit-rootless
      - systempaths=unconfined
    networks:
      - control
      - data
    volumes:
      - buildkit_cache:/home/user/.local/share/buildkit
      - ./buildkitd.prod.toml:/home/user/.config/buildkit/buildkitd.toml:ro
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${BUILDKIT_CPU_LIMIT:-4.0}"
          memory: "${BUILDKIT_MEMORY_LIMIT:-4G}"

volumes:
  snaphost_data:
  buildkit_cache:

networks:
  control:
    driver: bridge
  data:
    driver: bridge
    internal: true
