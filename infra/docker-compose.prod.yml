name: snaphost-self

# Production manifest. One application service pinned to an exact image SHA,
# plus the three pieces of infrastructure the platform does not implement
# itself.
#
# It used to be ten services and five images, and a deployment had to verify
# every one of those manifests existed at the same SHA before it could start.
# There is one now (Task 1).
#
# Still the wrong shape for a self-hosted product: this describes pushing a
# GHCR image onto a VDS over SSH, and a self-hosted platform is installed by
# its own operator. Rewriting the deployment story is its own task; this file
# is kept correct in the meantime rather than left referencing services that
# no longer exist.

services:
  snaphost:
    image: "${GHCR_IMAGE_PREFIX}/snaphost:${SNAPHOST_VERSION}"
    restart: unless-stopped
    networks:
      - control
      - data
    # The only published port. Everything else answers on an internal network,
    # and `data` is marked internal so PostgreSQL and Redis have no route out.
    ports:
      - "${API_GATEWAY_BIND_ADDRESS}:${API_GATEWAY_PORT}:8080"
    # The runtime backend starts user containers through the host daemon.
    # This is the largest privilege in the file: anything that can reach this
    # socket is root on the host. It replaced a cloud service-account key, and
    # unlike that key it has no per-environment identity to check.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      buildkitd:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${CONTROL_PLANE_CPU_LIMIT}"
          memory: "${CONTROL_PLANE_MEMORY_LIMIT}"
    environment:
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL}"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"

      OPERATOR_EMAIL: "${OPERATOR_EMAIL:-operator@localhost}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"

      RATE_LIMIT_IP: "${RATE_LIMIT_IP}"
      RATE_LIMIT_USER: "${RATE_LIMIT_USER}"
      RATE_LIMIT_DEPLOY: "${RATE_LIMIT_DEPLOY}"

      SAGA_WORKER_ENABLED: "${SAGA_WORKER_ENABLED}"
      SAGA_BUILD_TIMEOUT_MIN: "${SAGA_BUILD_TIMEOUT_MIN}"
      SAGA_RESUME_INTERVAL_SEC: "${SAGA_RESUME_INTERVAL_SEC}"
      DEPLOY_DEFAULT_PORT: "${DEPLOY_DEFAULT_PORT}"

      DOMAIN_SUFFIX: "${DOMAIN_SUFFIX}"
      RESERVED_DOMAINS: "${RESERVED_DOMAINS}"
      DEPLOY_TTL_MIN: "${DEPLOY_TTL_MIN}"
      DEPLOY_TTL_MAX_MIN: "${DEPLOY_TTL_MAX_MIN}"
      MAX_DOMAINS_PER_USER: "${MAX_DOMAINS_PER_USER}"
      DOMAIN_ATTACH_REQUIRE_IDENTITY: "${DOMAIN_ATTACH_REQUIRE_IDENTITY}"
      DOMAIN_ATTACH_PER_HOUR: "${DOMAIN_ATTACH_PER_HOUR}"
      DOMAIN_VERIFY_INTERVAL_SEC: "${DOMAIN_VERIFY_INTERVAL_SEC}"
      DOMAIN_REVERIFY_HOURS: "${DOMAIN_REVERIFY_HOURS}"
      DOMAIN_VERIFY_GRACE_HOURS: "${DOMAIN_VERIFY_GRACE_HOURS}"
      ALIAS_IDLE_GC_DAYS: "${ALIAS_IDLE_GC_DAYS}"
      PROJECT_DEPLOY_RETENTION: "${PROJECT_DEPLOY_RETENTION}"

      BUILDKIT_HOST: "tcp://buildkitd:1234"
      REGISTRY_URL: "${REGISTRY_PREFIX}"
      REGISTRY_INSECURE: "${REGISTRY_INSECURE}"
      WORKDIR_ROOT: "/var/snaphost/builds"
      MAX_REPO_SIZE_MB: "${MAX_REPO_SIZE_MB}"
      MAX_BUILD_TIME_MIN: "${MAX_BUILD_TIME_MIN}"
      MAX_CONCURRENT_PER_USER: "${MAX_CONCURRENT_PER_USER}"
      ALLOWED_GIT_HOSTS: "${ALLOWED_GIT_HOSTS}"
      ALLOWED_BASE_IMAGES: "${ALLOWED_BASE_IMAGES}"
      ALLOWED_BASE_IMAGES_PERMISSIVE: "${ALLOWED_BASE_IMAGES_PERMISSIVE}"
      SCAN_FAIL_ON_CRITICAL: "${SCAN_FAIL_ON_CRITICAL}"

      RUNNER_BACKEND: "docker"
      CONTAINER_CPU_LIMIT: "${CONTAINER_CPU_LIMIT}"
      CONTAINER_MEMORY_MB: "${CONTAINER_MEMORY_MB}"
      CONTAINER_DEFAULT_TTL_MIN: "${CONTAINER_DEFAULT_TTL_MIN}"
      RUNTIME_PROBE_ENABLED: "${RUNTIME_PROBE_ENABLED}"
      RUNTIME_PROBE_TIMEOUT_SEC: "${RUNTIME_PROBE_TIMEOUT_SEC}"
      WATCHDOG_INTERVAL_SEC: "${WATCHDOG_INTERVAL_SEC}"
      STRICT_IMAGE_VALIDATION: "${STRICT_IMAGE_VALIDATION}"
      REGISTRY_ALLOWED_PREFIXES: "${REGISTRY_PREFIX}"

      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_JSON_MODE: "${LLM_JSON_MODE}"
      LLM_TIMEOUT: "${LLM_TIMEOUT}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL}"
      OPENROUTER_REFERER: "${OPENROUTER_REFERER}"
      OPENROUTER_APP_NAME: "${OPENROUTER_APP_NAME}"
      CACHE_TTL_DAYS: "${CACHE_TTL_DAYS}"
      MAX_FILE_SIZE_KB: "${MAX_FILE_SIZE_KB}"
      MAX_FILES_PER_REQUEST: "${MAX_FILES_PER_REQUEST}"

  # One-shot migrators under a profile, so a deployment can apply the schema as
  # its own step before the service that would otherwise do it at startup is
  # allowed to run.
  snaphost-migrate:
    image: "${GHCR_IMAGE_PREFIX}/snaphost:${SNAPHOST_VERSION}"
    profiles: ["migration"]
    entrypoint: ["/control-migrate"]
    restart: "no"
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL}"


  postgres:
    image: "postgres:16.4-alpine3.20"
    restart: unless-stopped
    networks:
      - data
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT}"
          memory: "${POSTGRES_MEMORY_LIMIT}"

  redis:
    image: "redis:7.4.0-alpine3.20"
    restart: unless-stopped
    networks:
      - data
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT}"
          memory: "${REDIS_MEMORY_LIMIT}"

  buildkitd:
    image: "moby/buildkit:v0.29.0-rootless"
    restart: unless-stopped
    command: ["--addr", "tcp://0.0.0.0:1234", "--config", "/home/user/.config/buildkit/buildkitd.toml"]
    user: "1000:1000"
    security_opt:
      - seccomp=unconfined
      - apparmor=snaphost-buildkit-rootless
      - systempaths=unconfined
    networks:
      - control
      - data
    volumes:
      - buildkit_cache:/home/user/.local/share/buildkit
      - ./buildkitd.prod.toml:/home/user/.config/buildkit/buildkitd.toml:ro
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${BUILDKIT_CPU_LIMIT}"
          memory: "${BUILDKIT_MEMORY_LIMIT}"

volumes:
  postgres_data:
  redis_data:
  buildkit_cache:

networks:
  control:
    driver: bridge
  data:
    driver: bridge
    internal: true
