# Local development stack.
#
# One application service, because there is one process (Task 1). It replaced
# seven: api-gateway, user-billing, builder-api, builder-worker, runner-api,
# runner-watchdog and ai-orchestrator.
#
# What is left beside it is infrastructure the platform genuinely does not
# implement itself — PostgreSQL, Redis, BuildKit, a registry, and Traefik.
# Items 6 and 7 of Task 1 remove Redis and the registry as well.

services:
  snaphost:
    build:
      context: ../snaphost-backend
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    # The runtime backend starts user containers through the host daemon, so
    # this is the one mount that matters: anything that can reach it is root
    # on the host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      buildkitd:
        condition: service_started
      registry:
        condition: service_started
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: ${REDIS_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}

      # Identity. The gateway half verifies Supabase RS256 tokens against this
      # issuer's JWKS and refuses to start if the prefetch fails.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_WEBHOOK_SECRET: ${SUPABASE_WEBHOOK_SECRET}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}

      RATE_LIMIT_IP: ${RATE_LIMIT_IP:-30}
      RATE_LIMIT_USER: ${RATE_LIMIT_USER:-120}
      RATE_LIMIT_DEPLOY: ${RATE_LIMIT_DEPLOY:-5}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}

      # Deploys, projects and domains.
      DEPLOY_DEFAULT_PORT: ${DEPLOY_DEFAULT_PORT:-3000}
      DOMAIN_SUFFIX: ${DOMAIN_SUFFIX:-localhost}
      RESERVED_DOMAINS: ${RESERVED_DOMAINS:-}
      DEPLOY_TTL_MIN: ${DEPLOY_TTL_MIN:-30}
      DEPLOY_TTL_MAX_MIN: ${DEPLOY_TTL_MAX_MIN:-30}
      DOMAIN_CNAME_TARGET: ${DOMAIN_CNAME_TARGET:-}
      DOMAIN_A_RECORD_TARGET: ${DOMAIN_A_RECORD_TARGET:-}
      MAX_DOMAINS_PER_USER: ${MAX_DOMAINS_PER_USER:-1}
      DOMAIN_ATTACH_REQUIRE_IDENTITY: ${DOMAIN_ATTACH_REQUIRE_IDENTITY:-false}
      DOMAIN_ATTACH_PER_HOUR: ${DOMAIN_ATTACH_PER_HOUR:-5}
      DOMAIN_VERIFY_INTERVAL_SEC: ${DOMAIN_VERIFY_INTERVAL_SEC:-60}
      DOMAIN_REVERIFY_HOURS: ${DOMAIN_REVERIFY_HOURS:-24}
      DOMAIN_VERIFY_GRACE_HOURS: ${DOMAIN_VERIFY_GRACE_HOURS:-24}
      ALIAS_IDLE_GC_DAYS: ${ALIAS_IDLE_GC_DAYS:-30}
      PROJECT_DEPLOY_RETENTION: ${PROJECT_DEPLOY_RETENTION:-3}

      # Build pipeline.
      BUILDKIT_HOST: ${BUILDKIT_HOST:-tcp://buildkitd:1234}
      REGISTRY_URL: ${REGISTRY_URL:-registry:5000/snaphost}
      WORKDIR_ROOT: /var/snaphost/builds
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-500}
      MAX_BUILD_TIME_MIN: ${MAX_BUILD_TIME_MIN:-15}
      MAX_CONCURRENT_PER_USER: ${MAX_CONCURRENT_PER_USER:-3}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-github.com,gitlab.com,bitbucket.org}
      ALLOWED_BASE_IMAGES: ${ALLOWED_BASE_IMAGES:-node:,python:,golang:,ruby:,nginx:,alpine:,debian:,ubuntu:,gcr.io/distroless/,oven/bun:,denoland/deno:}
      ALLOWED_BASE_IMAGES_PERMISSIVE: ${ALLOWED_BASE_IMAGES_PERMISSIVE:-}
      SCAN_FAIL_ON_CRITICAL: ${SCAN_FAIL_ON_CRITICAL:-true}

      # Runtime.
      RUNNER_BACKEND: docker
      CONTAINER_CPU_LIMIT: ${CONTAINER_CPU_LIMIT:-0.5}
      CONTAINER_MEMORY_MB: ${CONTAINER_MEMORY_MB:-512}
      CONTAINER_DEFAULT_TTL_MIN: ${CONTAINER_DEFAULT_TTL_MIN:-30}
      RUNTIME_PROBE_ENABLED: ${RUNTIME_PROBE_ENABLED:-true}
      RUNTIME_PROBE_TIMEOUT_SEC: ${RUNTIME_PROBE_TIMEOUT_SEC:-30}
      WATCHDOG_INTERVAL_SEC: ${WATCHDOG_INTERVAL_SEC:-30}
      REGISTRY_AUTH: ${REGISTRY_AUTH:-}
      STRICT_IMAGE_VALIDATION: ${STRICT_IMAGE_VALIDATION:-false}
      REGISTRY_ALLOWED_PREFIXES: ${REGISTRY_ALLOWED_PREFIXES:-registry:5000/snaphost}

      # Dockerfile generation.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-http://localhost:5173}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-SnapHost}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
      CACHE_TTL_DAYS: ${CACHE_TTL_DAYS:-7}
    networks:
      - snaphost-net
    restart: unless-stopped

  buildkitd:
    image: moby/buildkit:v0.29.0-rootless
    command:
      - "--addr"
      - "tcp://0.0.0.0:1234"
      - "--config"
      - "/home/user/.config/buildkit/buildkitd.toml"
    user: "1000:1000"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - buildkit_cache:/home/user/.local/share/buildkit
      - ./buildkitd.toml:/home/user/.config/buildkit/buildkitd.toml:ro
    networks:
      - snaphost-net
    restart: unless-stopped

  registry:
    image: registry:2
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - snaphost-net
    restart: unless-stopped

  traefik:
    image: traefik:v2.11
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=snaphost-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    networks:
      - snaphost-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - snaphost-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - snaphost-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  buildkit_cache:
  registry_data:

networks:
  snaphost-net:
    # Pin the actual Docker network name (no project prefix) so the runtime,
    # which starts containers via the host docker daemon, can attach them to
    # this network by its bare name. Without `name:`, compose creates
    # "<project>_snaphost-net" and the host daemon doesn't see "snaphost-net".
    name: snaphost-net
    driver: bridge
