name: snaphost-self

# Local development stack.
#
# One application service and the two infrastructure components it uses:
# BuildKit for image builds and Traefik for local container routing.
#
# What is left beside it is infrastructure the platform genuinely does not
# implement itself — BuildKit and Traefik. PostgreSQL went with item 6, Redis
# with item 7, and the registry with the move to a local image store: the
# store is a SQLite file inside the application container, the queues, log
# fan-out, uploads and credentials Redis held are all in the process that uses
# them, and a built image is loaded straight into the host daemon that runs it.

services:
  snaphost:
    build:
      context: ../snaphost-backend
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    # The runtime backend starts user containers through the host daemon, so
    # this is the one mount that matters: anything that can reach it is root
    # on the host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # The database lives in this volume. It runs in WAL mode, so a live
      # backup must use sqlite3 .dump; copying only the main file can lose
      # committed pages from the WAL sidecar.
      - snaphost_data:/var/snaphost/data
    # The process needs this socket for the runtime while still cloning and
    # unpacking untrusted build input as uid 1000.
    #
    # Joining the socket's group keeps the non-root uid and grants only the
    # socket, which is the narrower of the two options — though "only the
    # socket" is still root-equivalent on the host, so this buys defence in
    # depth for the container filesystem rather than a real privilege boundary.
    #
    # 0 is the Docker Desktop default (the socket is root:root). On a Linux
    # host it is usually the `docker` group: `stat -c %g /var/run/docker.sock`.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    depends_on:
      buildkitd:
        condition: service_started
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # How much of the container limit is held back from the Go heap for page
      # cache and other non-heap memory. Empty takes the default.
      GOMEMLIMIT_RESERVE_MB: ${GOMEMLIMIT_RESERVE_MB:-}
      DATABASE_PATH: /var/snaphost/data/snaphost.db
      # Identity, issued here. The operator account is created on first start
      # and its password printed once to this container's log; nothing external
      # is contacted, and there is no default credential to change.
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-operator@localhost}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      # Unset derives the cookie's Secure attribute from the request, which is
      # what local development over http:// needs. Set it to true once an edge
      # terminates TLS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}

      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}

      # Deploys, projects and domains.
      DEPLOY_DEFAULT_PORT: ${DEPLOY_DEFAULT_PORT:-3000}
      DOMAIN_SUFFIX: ${DOMAIN_SUFFIX:-localhost}
      RESERVED_DOMAINS: ${RESERVED_DOMAINS:-}
      DEPLOY_TTL_MIN: ${DEPLOY_TTL_MIN:-30}
      DEPLOY_TTL_MAX_MIN: ${DEPLOY_TTL_MAX_MIN:-30}
      DOMAIN_CNAME_TARGET: ${DOMAIN_CNAME_TARGET:-}
      DOMAIN_A_RECORD_TARGET: ${DOMAIN_A_RECORD_TARGET:-}
      MAX_DOMAINS_PER_USER: ${MAX_DOMAINS_PER_USER:-1}
      DOMAIN_ATTACH_REQUIRE_IDENTITY: ${DOMAIN_ATTACH_REQUIRE_IDENTITY:-false}
      DOMAIN_ATTACH_PER_HOUR: ${DOMAIN_ATTACH_PER_HOUR:-5}
      DOMAIN_VERIFY_INTERVAL_SEC: ${DOMAIN_VERIFY_INTERVAL_SEC:-60}
      DOMAIN_REVERIFY_HOURS: ${DOMAIN_REVERIFY_HOURS:-24}
      DOMAIN_VERIFY_GRACE_HOURS: ${DOMAIN_VERIFY_GRACE_HOURS:-24}
      PROJECT_DEPLOY_RETENTION: ${PROJECT_DEPLOY_RETENTION:-3}

      # Build pipeline.
      BUILDKIT_HOST: ${BUILDKIT_HOST:-tcp://buildkitd:1234}
      WORKDIR_ROOT: /var/snaphost/builds
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-500}
      MAX_BUILD_TIME_MIN: ${MAX_BUILD_TIME_MIN:-15}
      MAX_CONCURRENT_PER_USER: ${MAX_CONCURRENT_PER_USER:-3}
      ALLOWED_GIT_HOSTS: ${ALLOWED_GIT_HOSTS:-github.com,gitlab.com,bitbucket.org}
      ALLOWED_BASE_IMAGES: ${ALLOWED_BASE_IMAGES:-node:,python:,golang:,ruby:,nginx:,alpine:,debian:,ubuntu:,gcr.io/distroless/,oven/bun:,denoland/deno:}
      ALLOWED_BASE_IMAGES_PERMISSIVE: ${ALLOWED_BASE_IMAGES_PERMISSIVE:-}

      # Runtime.
      CONTAINER_CPU_LIMIT: ${CONTAINER_CPU_LIMIT:-0.5}
      CONTAINER_MEMORY_MB: ${CONTAINER_MEMORY_MB:-512}
      CONTAINER_DEFAULT_TTL_MIN: ${CONTAINER_DEFAULT_TTL_MIN:-30}
      RUNTIME_PROBE_ENABLED: ${RUNTIME_PROBE_ENABLED:-true}
      RUNTIME_PROBE_TIMEOUT_SEC: ${RUNTIME_PROBE_TIMEOUT_SEC:-30}
      WATCHDOG_INTERVAL_SEC: ${WATCHDOG_INTERVAL_SEC:-30}
      STRICT_IMAGE_VALIDATION: ${STRICT_IMAGE_VALIDATION:-false}
      ALLOWED_IMAGE_PREFIXES: ${ALLOWED_IMAGE_PREFIXES:-snaphost/}

      # Dockerfile generation.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_REFERER: ${OPENROUTER_REFERER:-http://localhost:5173}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-SnapHost}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
    networks:
      - snaphost-net
    restart: unless-stopped
    # The ceiling, and the only place it is written. The process reads its own
    # cgroup at startup and derives GOMEMLIMIT from this — so there is one
    # number here rather than two that can drift apart, and the drift's symptom
    # would have been an OOM kill under load rather than an error.
    #
    # It has to cover more than the Go heap because the build workspace's page
    # cache and runtime non-heap allocations are charged here too. That is what
    # the reserve inside the process is for.
    deploy:
      resources:
        limits:
          memory: ${SNAPHOST_MEMORY_LIMIT:-512M}

  buildkitd:
    image: moby/buildkit:v0.29.0-rootless
    command:
      - "--addr"
      - "tcp://0.0.0.0:1234"
      - "--config"
      - "/home/user/.config/buildkit/buildkitd.toml"
    user: "1000:1000"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    volumes:
      - buildkit_cache:/home/user/.local/share/buildkit
      - ./buildkitd.toml:/home/user/.config/buildkit/buildkitd.toml:ro
    networks:
      - snaphost-net
    restart: unless-stopped

  traefik:
    image: traefik:v2.11
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=snaphost-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    networks:
      - snaphost-net
    restart: unless-stopped

volumes:
  snaphost_data:
  buildkit_cache:

networks:
  snaphost-net:
    # Pin the actual Docker network name (no project prefix) so the runtime,
    # which starts containers via the host docker daemon, can attach them to
    # this network by its bare name. Without `name:`, compose creates
    # "<project>_snaphost-net" and the host daemon doesn't see "snaphost-net".
    name: snaphost-net
    driver: bridge
