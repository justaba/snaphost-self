name: Production uptime probe

# External black-box monitoring for production. This is a floor, not a
# monitoring system: GitHub's scheduled runs are best-effort and routinely
# start 10-30 minutes late, and schedules are disabled automatically after 60
# days without repository activity. It catches "production has been down for a
# while and nobody noticed", not a 90-second blip, and it cannot see anything
# inside the VDS — for that, see the backup heartbeat in docs/operations/monitoring.md.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe the public surfaces
        id: probe
        continue-on-error: true
        run: bash .github/scripts/uptime-check.sh

      # One issue is reused for the whole incident. A new issue every ten
      # minutes would bury the first one, which is the only one carrying the
      # time the outage started.
      - name: Open or update the incident issue
        if: steps.probe.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
          REPORT: ${{ steps.probe.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Production probe is failing'
          existing=$(gh issue list --state open --label uptime --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          body=$(printf 'Detected at %s UTC.\n\n**Failing checks**\n```\n%s\n```\n\n**Full report**\n```\n%s\n```\n\n[Probe run](%s)\n' \
            "$(date -u +%FT%TZ)" "$SUMMARY" "$REPORT" "$RUN_URL")
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create uptime --color B60205 --description 'Production availability' 2>/dev/null || true
            gh issue create --title "$title" --label uptime --body "$body"
          fi

      - name: Close the incident issue on recovery
        if: steps.probe.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.probe.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Production probe is failing'
          existing=$(gh issue list --state open --label uptime --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [[ -n "$existing" ]]; then
            body=$(printf 'All checks passed at %s UTC; closing.\n\n```\n%s\n```\n\n[Probe run](%s)\n' \
              "$(date -u +%FT%TZ)" "$REPORT" "$RUN_URL")
            gh issue close "$existing" --comment "$body"
          fi

      # The probe step swallows its own failure so the issue steps can run;
      # surface it here so the workflow itself is red while production is down.
      - name: Fail the workflow when the probe failed
        if: steps.probe.outputs.failed == 'true'
        run: |
          echo "production probe failed; see the incident issue" >&2
          exit 1
