name: CI and image publishing

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # One job, because snaphost-backend/ is one module (Task 1 item 4). The matrix
  # this replaces had to be kept in step by hand with the Makefile's GO_MODULES
  # list, and a service missing from either was silently never checked.
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snaphost-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: snaphost-backend/go.mod
          cache-dependency-path: snaphost-backend/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      # Nothing ran a linter upstream until 2026-08-07, so formatting and the
      # default checks drifted unnoticed: golangci-lint's default set excludes
      # gofmt. Config lives in snaphost-backend/.golangci.yml. The version is
      # pinned because the v2 config schema is incompatible with the file it
      # reads — moving to it means changing both in the same commit.
      #
      # Built from source rather than downloaded. golangci-lint refuses to load
      # a config for a module whose Go version is newer than the toolchain the
      # linter itself was built with, and the published v1.64.8 binary is built
      # with go1.24 while this module targets 1.25. `go install` uses this job's
      # own toolchain, so the two can never disagree again.
      - name: Install golangci-lint
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: golangci-lint run ./...

  shell:
    name: Deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax
        run: |
          bash -n infra/deploy.sh
          bash -n infra/backup.sh
          bash -n .github/scripts/uptime-check.sh
          bash -n infra/tests/deploy_test.sh
          bash -n infra/tests/backup_test.sh
      - name: Lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning infra/deploy.sh infra/backup.sh .github/scripts/uptime-check.sh
      # Both suites fake every external command, so they touch no Docker
      # daemon, database, credential, or network.
      - name: Deployment suite
        run: bash infra/tests/deploy_test.sh
      - name: Backup suite
        run: bash infra/tests/backup_test.sh
      - name: systemd units are parseable
        run: |
          systemd-analyze verify infra/systemd/snaphost-backup.service 2>&1 | tee /tmp/verify.log
          # The unit references paths that exist only on the VDS, so only
          # syntax errors are fatal here.
          ! grep -qiE 'invalid|unknown (lvalue|section)' /tmp/verify.log

  images:
    name: Image / ${{ matrix.image }}
    needs: [go, shell]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api-gateway, context: snaphost-backend, dockerfile: snaphost-backend/docker/Dockerfile.gateway }
          - { image: user-billing, context: snaphost-backend, dockerfile: snaphost-backend/docker/Dockerfile.control }
          - { image: builder-svc, context: snaphost-backend, dockerfile: snaphost-backend/docker/Dockerfile.builder }
          - { image: runner-svc, context: snaphost-backend, dockerfile: snaphost-backend/docker/Dockerfile.runtime }
          - { image: ai-orchestrator, context: snaphost-backend, dockerfile: snaphost-backend/docker/Dockerfile.ai }
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Staging has no host at the moment: the temporary VDS was released and
  # production now runs on its own machine. The job is kept rather than deleted
  # because staging is the place where a bad migration is supposed to be found,
  # and that need returns as soon as there are users to protect.
  #
  # To bring it back: point the `staging` environment's DEPLOY_SSH_HOST,
  # DEPLOY_SSH_KNOWN_HOSTS and DEPLOY_SSH_PRIVATE_KEY at the new host, check
  # the remaining staging variables, then set repository variable
  # STAGING_DEPLOY_ENABLED=true. Nothing else has to change.
  deploy-staging:
    name: Deploy staging
    needs: [images]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure verified SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
      - name: Verify images and deploy exact SHA
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_SMOKE_URL: ${{ vars.DEPLOY_SMOKE_URL }}
          DEPLOY_GHCR_USERNAME: ${{ vars.DEPLOY_GHCR_USERNAME }}
          DEPLOY_COMPOSE_PROJECT: ${{ vars.DEPLOY_COMPOSE_PROJECT }}
          SSH_KEY_FILE: ${{ runner.temp }}/deploy-key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/deploy-known-hosts
          GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: .github/scripts/deploy-remote.sh "${{ github.sha }}"
