name: CI and image publishing

# Tags are a trigger because a version tag is what an operator installs
# (Task 7). Pushes to main still publish a per-SHA image so a regression can be
# bisected; that tag is a debugging affordance and never an upgrade target.
on:
  push:
    branches: [main]
    # GitHub's filter syntax supports [0-9]+. The publishing step additionally
    # rejects leading zeroes in version components.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # One job, because snaphost-backend/ is one module (Task 1 item 4). The matrix
  # this replaces had to be kept in step by hand with the Makefile's GO_MODULES
  # list, and a service missing from either was silently never checked.
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snaphost-backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: snaphost-backend/go.mod
          cache-dependency-path: snaphost-backend/go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      # Nothing ran a linter upstream until 2026-08-07, so formatting and the
      # default checks drifted unnoticed: golangci-lint's default set excludes
      # gofmt. Config lives in snaphost-backend/.golangci.yml. The version is
      # pinned because the v2 config schema is incompatible with the file it
      # reads — moving to it means changing both in the same commit.
      #
      # Built from source rather than downloaded. golangci-lint refuses to load
      # a config for a module whose Go version is newer than the toolchain the
      # linter itself was built with, and the published v1.64.8 binary is built
      # with go1.24 while this module targets 1.25. `go install` uses this job's
      # own toolchain, so the two can never disagree again.
      - name: Install golangci-lint
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: golangci-lint run ./...

  panel:
    name: Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snaphost-backend/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build

  shell:
    name: Deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax
        run: |
          bash -n infra/deploy.sh
          bash -n infra/backup.sh
          bash -n infra/snaphostctl
          bash -n infra/tests/deploy_test.sh
          bash -n infra/tests/backup_test.sh
          bash -n infra/tests/snaphostctl_test.sh
          bash -n infra/resolve-image-tags.sh
          bash -n infra/tests/release_tags_test.sh
          bash -n infra/tests/caddy_integration_test.sh
          python3 -c 'from pathlib import Path; compile(Path("infra/tests/optional_ai_integration_test.py").read_text(), "optional_ai_integration_test.py", "exec")'
          python3 -c 'from pathlib import Path; compile(Path("infra/tests/node_build_rehearsal.py").read_text(), "node_build_rehearsal.py", "exec")'
      - name: Lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning infra/deploy.sh infra/backup.sh infra/snaphostctl infra/resolve-image-tags.sh infra/tests/release_tags_test.sh infra/tests/caddy_integration_test.sh
      - name: Production configurations
        env:
          SNAPHOST_VERSION: v0.0.0
          SNAPHOST_CONTROL_DOMAIN: panel.example.invalid
          SNAPHOST_ACME_EMAIL: operator@example.invalid
        run: |
          docker compose -f infra/docker-compose.prod.yml config --quiet
          docker run --rm \
            -e SNAPHOST_CONTROL_DOMAIN -e SNAPHOST_ACME_EMAIL \
            -v "$PWD/infra/Caddyfile.production.example:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Caddy routing and persistent-state integration
        run: bash infra/tests/caddy_integration_test.sh
      # These three script suites fake external commands.
      - name: Deployment suite
        run: bash infra/tests/deploy_test.sh
      - name: Backup suite
        run: bash infra/tests/backup_test.sh
      - name: Install and upgrade suite
        run: bash infra/tests/snaphostctl_test.sh
      - name: Release tag suite
        run: bash infra/tests/release_tags_test.sh
      - name: systemd units are parseable
        run: |
          mkdir -p /tmp/snaphost-units
          cp infra/systemd/snaphost-backup.service /tmp/snaphost-units/
          cp infra/systemd/snaphost-backup.timer /tmp/snaphost-units/
          cp infra/systemd/snaphost-tls-backup.timer /tmp/snaphost-units/
          sed 's|@SNAPHOST_CADDY_STATE_DIR@|/opt/snaphost/state/caddy|g' \
            infra/systemd/snaphost-tls-backup.service \
            >/tmp/snaphost-units/snaphost-tls-backup.service
          cd /tmp/snaphost-units
          systemd-analyze verify \
            snaphost-backup.service \
            snaphost-backup.timer \
            snaphost-tls-backup.service \
            snaphost-tls-backup.timer \
            2>&1 | tee /tmp/verify.log || true
          # The unit references paths that exist only on an installed host, so
          # only syntax errors are fatal here.
          ! grep -qiE 'invalid|unknown (lvalue|section)|path is not absolute' /tmp/verify.log

  # One image, because there is one process. The matrix this replaces built
  # five, and a deployment had to verify all five manifests existed at the same
  # SHA before it could start.
  #
  # This job publishes. It does not deploy: nothing here reaches an operator's
  # machine, and there is no SSH key, deploy secret or GitHub environment left
  # in this repository (Task 7 item 2). An operator installs and upgrades from
  # their own host against the public package this job pushes to.
  image:
    name: Image
    needs: [go, panel, shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Two tag shapes that mean different things, and no third one. The SHA
      # tag is published from every main push for bisecting. The version tag is
      # what `deploy.sh` validates and what an operator upgrades to.
      #
      # `latest` is deliberately never published. A rendered manifest names one
      # exact version, so two installs of the same file cannot silently differ
      # and a rollback always has a point to return to. What `latest` was
      # wanted for is a command, not a tag: Task 7's remaining operator CLI
      # will resolve the newest published version and pin it.
      #
      # The package's visibility is a repository setting rather than something
      # this job can assert: it must be public, or every install needs a
      # credential from us. See Task 7's version and registry model.
      - name: Resolve image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}/snaphost
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: bash infra/resolve-image-tags.sh
      - name: Build and optionally publish
        uses: docker/build-push-action@v7
        with:
          context: snaphost-backend
          file: snaphost-backend/docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=snaphost
          cache-to: type=gha,mode=max,scope=snaphost
