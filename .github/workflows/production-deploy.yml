name: Production deployment

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA whose backend images exist
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  validate-sha:
    name: Validate production SHA
    runs-on: ubuntu-latest
    steps:
      - name: Require an exact Git SHA
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "sha must contain exactly 40 hexadecimal characters" >&2
            exit 1
          }

  deploy-production:
    name: Deploy production
    needs: [validate-sha]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Require SHA from main history
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "production SHA must be an ancestor of origin/main" >&2
            exit 1
          }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure verified SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
      - name: Verify images and deploy exact SHA
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_SMOKE_URL: ${{ vars.DEPLOY_SMOKE_URL }}
          DEPLOY_GHCR_USERNAME: ${{ vars.DEPLOY_GHCR_USERNAME }}
          DEPLOY_COMPOSE_PROJECT: ${{ vars.DEPLOY_COMPOSE_PROJECT }}
          SSH_KEY_FILE: ${{ runner.temp }}/deploy-key
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/deploy-known-hosts
          GHCR_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: .github/scripts/deploy-remote.sh "${{ inputs.sha }}"
